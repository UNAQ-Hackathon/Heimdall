name: CI/CD — Heimdall (Azure App Service)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_services:
        description: 'Services to deploy to Azure App Service'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - api
          - analytics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-frontend:
    name: CI — Frontend (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Verify production build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

  ci-api:
    name: CI — API (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: node --test tests/*.test.js

  ci-analytics:
    name: CI — Analytics (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analytics tests
        run: python -m unittest discover -s tests -v

  deploy-frontend:
    name: CD — Deploy Frontend to Azure App Service
    needs: [ci-frontend, ci-api, ci-analytics]
    if: >-
      github.repository_owner == 'UNAQ-Hackathon' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.deploy_services == 'all' || inputs.deploy_services == 'frontend')))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Azure publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Missing secret AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: |
          npm ci
          npm run build

      - name: Package frontend for Azure App Service
        run: ./deploy/azure/package.sh frontend

      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: deploy-artifacts/frontend.zip

  deploy-api:
    name: CD — Deploy API to Azure App Service
    needs: [ci-frontend, ci-api, ci-analytics]
    if: >-
      github.repository_owner == 'UNAQ-Hackathon' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.deploy_services == 'all' || inputs.deploy_services == 'api')))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Azure publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Missing secret AZURE_WEBAPP_PUBLISH_PROFILE_API. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Package API for Azure App Service
        run: ./deploy/azure/package.sh api

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: deploy-artifacts/api.zip

  deploy-analytics:
    name: CD — Deploy Analytics to Azure App Service
    needs: [ci-frontend, ci-api, ci-analytics]
    if: >-
      github.repository_owner == 'UNAQ-Hackathon' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
          (inputs.deploy_services == 'all' || inputs.deploy_services == 'analytics')))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Azure publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ANALYTICS }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Missing secret AZURE_WEBAPP_PUBLISH_PROFILE_ANALYTICS. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Analytics for Azure App Service
        run: ./deploy/azure/package.sh analytics

      - name: Deploy Analytics to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ANALYTICS }}
          package: deploy-artifacts/analytics.zip
