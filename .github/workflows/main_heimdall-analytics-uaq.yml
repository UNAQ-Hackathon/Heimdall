# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - heimdall-analytics-uaq

on:
  push:
    branches:
      - 'main'
    paths:
      - 'analytics/**'
      - '**/firehazr/**'
      - '.github/workflows/main_heimdall-analytics-uaq.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Start virtual environment and Install dependencies
        working-directory: ./analytics
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy firehazr module into analytics artifact
        run: |
          FIREHAZR_DIR=$(find . -maxdepth 3 -type d -name "firehazr" ! -path "./analytics/*" | head -n 1)
          if [ -n "$FIREHAZR_DIR" ]; then
            cp -r "$FIREHAZR_DIR" ./analytics/
          fi

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ./analytics
            !./analytics/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DDACA0607441403B89234CE31C3AB908 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_491BA08250F044AEA103816F0561C766 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC6DF0F3E68A4EF19A450601A0C60515 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'heimdall-analytics-uaq'
          slot-name: 'Production'
          package: .
