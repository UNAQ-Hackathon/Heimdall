name: Build and deploy Python app to Azure Web App - heimdall-analytics-uaq

on:
  push:
    branches:
      - 'main'
    paths:
      - 'analytics/**'
      - 'PredictorFireHazard-main/**'
      - '.github/workflows/main_heimdall-analytics-uaq.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Start virtual environment and Install dependencies
        working-directory: ./analytics
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy firehazr package into analytics artifact
        run: |
          mkdir -p ./analytics/firehazr
          cp -r "./PredictorFireHazard-main/Sensibilidad de gases/knn/." ./analytics/firehazr/
          touch ./analytics/firehazr/__init__.py

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ./analytics
            !./analytics/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DDACA0607441403B89234CE31C3AB908 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_491BA08250F044AEA103816F0561C766 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC6DF0F3E68A4EF19A450601A0C60515 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'heimdall-analytics-uaq'
          slot-name: 'Production'
          package: .
